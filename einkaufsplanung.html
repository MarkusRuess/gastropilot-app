<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GastroPilot · Einkaufsplanung</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#171717;background:#fff}*{box-sizing:border-box}body{margin:0}header{background:#fff;color:#111;border-bottom:1px solid #ddd;padding:18px}main{max-width:980px;margin:auto;padding:14px}h1{font-size:23px;margin:0 0 6px}a{color:inherit}.panel{background:white;border:1px solid #ddd;border-radius:14px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.tile{background:#fff;border:1px solid #e3e3e3;border-radius:12px;padding:12px}.tile strong{display:block;font-size:24px;margin:7px 0}.muted{color:#666;font-size:13px}label{font-size:13px;display:block;margin-bottom:5px}input{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;font-size:16px}button{padding:10px 14px;background:#fff;color:#111;border:1px solid #ddd;border:0;border-radius:9px;cursor:pointer}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px 6px;border-bottom:1px solid #ddd;text-align:left}th:last-child,td:last-child{text-align:right}.scroll{overflow-x:auto}.warn{color:#975700}.error{color:#b00020}@media(max-width:550px){main{padding:9px}.panel{padding:12px}h1{font-size:20px}}
</style></head><body><header><h1>GastroPilot · Einkaufsplanung</h1><a href="./index.html">← Dashboard</a></header><main>
<div class="panel"><label for="month">Auswertungsmonat</label><input id="month" type="month" value="2026-10"><p class="muted" id="status">Lade BONit-Daten …</p></div>
<div class="panel"><h2>Einkauf · nächste Woche</h2><div id="items"></div><p class="muted">Bestände, Gebinde und Reserve werden dauerhaft in Supabase geführt. <a href="./index.html?betrieb=friedrich&amp;lager=1">📦 Lager &amp; Inventur</a></p></div></main><script type="module">

const db=createClient('https://sjnwfwcpgwsavygewwzb.supabase.co','sb_publishable__tucXG-IQGUhibMqMSUzCw_5RnH_sbQ');
const BID='6a5484d1-daf6-4263-897d-24cdf536aa29';
