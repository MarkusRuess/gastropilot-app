<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#222222"><title>Social Media Zentrale – Vorschau</title><style>body{font:16px system-ui;margin:24px auto;padding:0 16px;max-width:1000px;background:#f5f5f5;color:#222}section{background:white;border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.tile{background:#eee;padding:12px;border-radius:8px}.tile strong{display:block;font-size:24px}li{padding:8px}small{color:#555}</style><h1>Social Media Zentrale</h1><p>Lokale Vorschau · keine Konten verbunden · keine Veröffentlichung</p><section><label>Monat <input type="month" id="month" value="2026-11"></label><div class="tiles" id="tiles"></div></section><section><h2>Redaktionskalender</h2><ul id="calendar"></ul></section><section><h2>Kanäle</h2><ul id="channels"></ul></section><script type="module">import {dashboard} from './dashboard.mjs';const month=document.getElementById('month');const input={businessId:'demo',posts:[],channels:[],deliveries:[]};function render(){const data=dashboard({...input,month:month.value});const tiles=document.getElementById('tiles');tiles.replaceChildren();for(const [key,label] of Object.entries({drafts:'Entwürfe',pending:'Freigaben',scheduled:'Geplant',published:'Veröffentlicht',errors:'Fehler'})){const el=document.createElement('div');el.className='tile';const n=document.createElement('strong');n.textContent=data.counts[key];el.append(n,document.createTextNode(label));tiles.append(el)}for(const [id,rows,empty] of [['calendar',data.calendar,'Keine geplanten Beiträge'],['channels',data.channels,'Keine verbundenen Kanäle']]){const list=document.getElementById(id);list.replaceChildren();for(const row of rows.length?rows:[null]){const li=document.createElement('li');li.textContent=row?(row.body??row.display_name??row.platform):empty;list.append(li)}}}month.addEventListener('change',()=>{if(month.value)render()});render();</script></html>
