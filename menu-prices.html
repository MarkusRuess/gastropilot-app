<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>GastroPilot · Das Friedrich Karte</title>
<style>
:root{font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:#20303c;background:#f2f4f7;--ink:#20394a;--green:#328d7e;--line:#dce5e8;--muted:#68798c}*{box-sizing:border-box}body{margin:0}header{background:#20394a;color:white;padding:16px max(16px,calc((100vw - 1080px)/2))}header a{color:#d8ece8;text-decoration:none}h1{font-size:23px;margin:8px 0 0}main{max-width:1080px;margin:auto;padding:16px}.card,details{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}p{margin:8px 0;color:var(--muted)}label{display:block;font-weight:600}input{font:inherit;padding:10px 12px;border:1px solid #b9cbd0;border-radius:9px;min-width:0}input[type=search]{width:100%;margin-top:8px}.hidden{display:none!important}button{font:inherit;font-weight:700;border:0;border-radius:9px;background:var(--ink);color:white;padding:10px 14px;cursor:pointer}button:disabled{opacity:.55}.primary{background:var(--green)}summary{font-weight:750;font-size:18px;cursor:pointer;color:var(--ink)}.category-count{font-weight:400;color:var(--muted);font-size:14px}.rows{display:grid;gap:9px;margin-top:14px}.item{border:1px solid var(--line);background:#fbfcfd;border-radius:11px;padding:12px;display:grid;grid-template-columns:minmax(170px,1fr) auto auto auto;gap:9px;align-items:center}.name{font-weight:700}.serving,.note,.muted{color:var(--muted)}.note{font-size:13px;color:#ad6b26}.current small,.proposal small{display:block;color:var(--muted);font-size:12px}.current strong{font-size:19px}.proposal input{width:115px}.save{min-width:94px}.status{font-size:13px;color:#287466;min-height:18px;grid-column:1/-1}.error{color:#ad3d33}@media(max-width:680px){.item{grid-template-columns:1fr 1fr}.namebox{grid-column:1/-1}.current,.proposal{align-self:end}.proposal input{width:100%}.save{grid-column:1/-1}.status{grid-column:1/-1}} 
@media(max-width:480px){main{padding:10px}.card,details{padding:13px;margin:9px 0}header{padding:13px}h1{font-size:20px;line-height:1.25}.item{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:11px;min-width:0}.namebox,.name,.serving,.note,.current,.proposal{min-width:0;overflow-wrap:anywhere}.name{font-size:16px;line-height:1.3}.serving{font-size:14px}.current strong{font-size:18px}.proposal input{min-width:0;width:100%;font-size:16px}.save{width:100%;min-height:44px}.category-count{display:block;margin-top:3px}.rows{gap:8px}}
</style></head><body>
<header><a href="index.html">← Dashboard</a> · <a href="kalkulation.html">Kalkulation</a><h1>Das Friedrich · Kartenpreise</h1></header>
<main><section id="login" class="card"><h2>Anmelden</h2><form id="loginForm"><label>E-Mail<input id="email" type="email" autocomplete="username" required></label><label>Passwort<input id="password" type="password" autocomplete="current-password" required></label><p><button class="primary">Anmelden</button></p></form><p id="loginMsg"></p></section>
<div id="app" class="hidden"><section class="card"><strong id="count">Karte wird geladen …</strong><p>Gedruckter VK = aktueller Kartenpreis inkl. USt. Neuer VK = interner Vorschlag. Speichern ändert weder BONit noch die gedruckte Karte.</p><label>Artikel suchen<input id="search" type="search" placeholder="z. B. Freixenet, Bier, 0,1 l"></label></section><div id="categories"></div><p id="message"></p></div></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://sjnwfwcpgwsavygewwzb.supabase.co','sb_publishable__tucXG-IQGUhibMqMSUzCw_5RnH_sbQ');
const BID='6a5484d1-daf6-4263-897d-24cdf536aa29',E=id=>document.getElementById(id),money=v=>new Intl.NumberFormat('de-AT',{style:'currency',currency:'EUR'}).format(Number(v));
let catalog=[];
function itemCard(item){
 const card=document.createElement('div');card.className='item';
 const namebox=document.createElement('div');namebox.className='namebox';
 const name=document.createElement('div');name.className='name';name.textContent=item.article_name;
 const serving=document.createElement('div');serving.className='serving';serving.textContent=item.serving;
 namebox.append(name,serving);
 if(item.source_note?.includes('prüfen')||item.source_note?.startsWith('Marktpreis Baden:')){const note=document.createElement('div');note.className='note';note.textContent=item.source_note;namebox.append(note)}
 const current=document.createElement('div');current.className='current';const currentTitle=document.createElement('small');currentTitle.textContent='Karten-VK';const currentValue=document.createElement('strong');currentValue.textContent=money(item.printed_gross_price);current.append(currentTitle,currentValue);
 const proposal=document.createElement('label');proposal.className='proposal';const proposedTitle=document.createElement('small');proposedTitle.textContent='Neuer VK inkl. USt.';const input=document.createElement('input');input.type='number';input.min='0';input.step='0.10';input.inputMode='decimal';input.placeholder='–';input.value=item.proposed_gross_price??'';proposal.append(proposedTitle,input);
 const button=document.createElement('button');button.className='save primary';button.type='button';button.textContent='Speichern';
 const status=document.createElement('div');status.className='status';status.setAttribute('aria-live','polite');
 button.onclick=async()=>{const raw=input.value.trim();const amount=raw===''?null:Number(raw.replace(',','.'));if(amount!==null&&(!Number.isFinite(amount)||amount<0||!/^\d+(?:[.,]\d{1,2})?$/.test(raw))){status.textContent='Bitte einen gültigen Europreis eingeben.';status.classList.add('error');return}button.disabled=true;status.textContent='Speichere …';status.classList.remove('error');const {data,error}=await db.from('menu_prices').update({proposed_gross_price:amount,updated_at:new Date().toISOString()}).eq('id',item.id).eq('business_id',BID).select('id,proposed_gross_price').single();if(error){status.textContent='Nicht gespeichert: '+error.message;status.classList.add('error')}else{item.proposed_gross_price=data.proposed_gross_price;status.textContent=amount===null?'Vorschlag entfernt.':'Vorschlag gespeichert: '+money(amount)}button.disabled=false};
 card.append(namebox,current,proposal,button,status);return card;
}
function render(){const term=E('search').value.toLocaleLowerCase('de-AT').trim(),host=E('categories');host.replaceChildren();let visible=0;const groups=new Map();for(const item of catalog){if(term&&!([item.article_name,item.category,item.serving].join(' ').toLocaleLowerCase('de-AT').includes(term)))continue;visible++;if(!groups.has(item.category))groups.set(item.category,[]);groups.get(item.category).push(item)}for(const [category,items] of groups){const group=document.createElement('details');group.open=!!term;const summary=document.createElement('summary');summary.textContent=category+' ';const count=document.createElement('span');count.className='category-count';count.textContent='('+items.length+')';summary.append(count);const rows=document.createElement('div');rows.className='rows';items.forEach(x=>rows.append(itemCard(x)));group.append(summary,rows);host.append(group)}E('count').textContent=visible+' von '+catalog.length+' Kartenpreisen'+(term?' gefunden':' erfasst')}
async function enter(){const {data,error}=await db.auth.getSession();if(error)throw error;const user=data?.session?.user;if(!user)return false;const m=await db.from('business_members').select('role').eq('business_id',BID).eq('user_id',user.id).eq('role','owner').limit(1);if(m.error)throw m.error;if(!m.data?.length)throw Error('Für dieses Konto fehlt die Freigabe.');E('login').classList.add('hidden');E('app').classList.remove('hidden');const response=await db.from('menu_prices').select('id,category,article_name,serving,printed_gross_price,proposed_gross_price,source_note,menu_key').eq('business_id',BID).order('menu_key').limit(500);if(response.error)throw response.error;catalog=response.data||[];render();return true}
E('search').oninput=render;
E('loginForm').onsubmit=async ev=>{ev.preventDefault();const button=ev.currentTarget.querySelector('button');button.disabled=true;E('loginMsg').textContent='Anmeldung wird geprüft …';try{const {data,error}=await db.auth.signInWithPassword({email:E('email').value.trim(),password:E('password').value});if(error)throw error;if(!data.session)throw Error('Keine Sitzung erhalten.');await enter()}catch(e){E('loginMsg').textContent=e.message}finally{button.disabled=false}};
try{await enter()}catch(e){E('loginMsg').textContent=e.message;E('message').textContent=e.message}
</script></body></html>
