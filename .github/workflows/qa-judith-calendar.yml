name: Judith calendar checks
on:
  push:
    branches: [main, 'feat/judith-calendar-*']
    paths: ['judith-ai/**', 'scripts/*judith*', 'supabase/functions/judith-ai-inbox/**', '.github/workflows/qa-judith-calendar.yml']
  pull_request:
    paths: ['judith-ai/**', 'scripts/*judith*', 'supabase/functions/judith-ai-inbox/**', '.github/workflows/qa-judith-calendar.yml']
jobs:
  calendar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-judith-inline.mjs
      - run: node --test scripts/test-judith-calendar.mjs scripts/test-judith-calendar-server.mjs scripts/test-price-advisor*.mjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-judith-calendar-ui.mjs
