name: GastroPilot QA
on:
  pull_request:
  push:
    branches:
      - 'qa/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static checks (no secrets, no database writes)
        run: node scripts/qa-static.mjs
