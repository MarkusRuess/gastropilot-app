name: Judith Orders and Backlist Tests
on:
  pull_request:
    paths: ['judith-ai/**', 'scripts/test-judith-backlist*.mjs', '.github/workflows/qa-judith-backlist.yml']
  push:
    branches: [main]
    paths: ['judith-ai/**', 'scripts/test-judith-backlist*.mjs', '.github/workflows/qa-judith-backlist.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/test-judith-backlist.mjs
      - run: node --check judith-ai/backlist.mjs
      - run: node scripts/check-judith-inline.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-judith-backlist-browser.mjs
