name: Unternehmenszentrale registry checks
on:
  pull_request:
    paths: ['unternehmenszentrale/**', '.github/workflows/qa-unternehmenszentrale.yml']
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test unternehmenszentrale/registry.test.mjs
