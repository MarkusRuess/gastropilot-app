name: Unternehmenszentrale registry checks
on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['unternehmenszentrale/**', 'supabase/functions/**', '.github/workflows/qa-unternehmenszentrale.yml']
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test unternehmenszentrale/*.test.mjs
      - name: Run shared offline project checks
        run: |
          bash unternehmenszentrale/cli-anything/install.sh "$RUNNER_TEMP/enterprise"
          "$RUNNER_TEMP/enterprise/bin/uz-cli" --json check --project judith
          "$RUNNER_TEMP/enterprise/bin/uz-cli" --json check --project friedrich
      - run: node ./unternehmenszentrale/report.mjs >> "$GITHUB_STEP_SUMMARY"

      - run: node ./unternehmenszentrale/learning.mjs >> "$GITHUB_STEP_SUMMARY"
