name: Judith photo upload
on: [push, pull_request]
permissions:
  contents: read
jobs:
  photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test test-judith-photo-upload.mjs
